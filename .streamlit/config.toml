[theme]
base = "light"
primaryColor = "#9b1fe8"
backgroundColor = "#f6f5fa"
secondaryBackgroundColor = "#f1ecfb"
textColor = "#1f1534"
borderColor = "#e6e0f0"
baseRadius = "12px"
font = "Poppins:https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
headingFont = "Poppins:https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"

[theme.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f6f0ff"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
maxUploadSize = 10
